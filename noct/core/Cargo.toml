[package]
name = "noct-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
# The shielded pool: Zcash's Orchard, Halo 2, no trusted setup.
#
# **Not below 0.14.0, ever.** Every release up to and including 0.13.1 is yanked
# because the original Action circuit was unsound; the fix shipped with the
# halo2_gadgets 0.5.0 critical fix in NU6.2. The same releases also fixed
# GHSA-2x4w-pxqw-58v9 (proofs padded with trailing data, and an identity `epk`).
# Only the fixed circuit is used here — see `shielded::CIRCUIT`.
#
# This is the dependency that set the workspace's Rust floor at 1.85.1.
orchard = "0.15.5"
curve25519-dalek = { version = "4", features = ["rand_core"] }
tiny-keccak = { version = "2", features = ["keccak"] }
rand_core = { version = "0.6", features = ["getrandom"] }
bs58 = "0.5"

# Layer 4 (amounts): Monero-compatible Bulletproofs+ over ed25519, built on
# curve25519-dalek. These reuse Monero's audited construction, generators, and
# byte formats so a professional audit can diff against Monero rather than
# review novel cryptography. See amounts.rs.
# These are the **first-party** crates from `monero-oxide` (the project serai's
# Monero code was spun out into), published 2026-07-31. They replace the
# third-party `-mirror` republish we used while serai's own crates.io names were
# empty placeholders — a republish whose description said it would be deleted,
# and whose bytes an auditor would have had to verify against serai by hand.
#
# Every MSRV here is <= 1.67, comfortably under the pinned 1.82 toolchain.
#
# Migration was proven consensus-safe before adoption: `H_p` (which derives key
# images, `I = x·H_p(P)`) is byte-identical between the mirror's `hash_to_point`
# and `monero_ed25519::Point::biased_hash` across 35 inputs, so no key image and
# no historical block changes. See docs/DEPENDENCIES.md §6.
monero-primitives = "0.1"
monero-bulletproofs = "0.1"
# Layer 5 (ring signatures): Monero-compatible CLSAG. Also carries `Decoys`,
# which used to live in monero-primitives.
monero-clsag = "0.1"
# ed25519 types plus `Point::biased_hash` (Monero's `hash_to_ec`/Elligator 2) and
# `Commitment`. This replaces the old `monero-generators`, which upstream split
# into `monero-ed25519` + `monero-bulletproofs-generators`.
monero-ed25519 = "0.1"
# Used directly, for `Zeroizing` around secret scalars in ring.rs.
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"
