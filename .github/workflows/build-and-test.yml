name: build and test

# There was no CI that compiled or tested this repository. Every `cargo test`
# was run by hand on a developer machine, which meant a green local run was the
# only evidence anything worked, and nothing checked a pull request at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: workspace build + test
    runs-on: ubuntu-latest
    # A guard against a hang, not a speed limit. 40 was set when the suite took
    # about 14 minutes; by 2026-10-01 it takes 27, because the tests that pay for
    # themselves most are the slow ones — they build and verify real Halo 2
    # proofs. `fee_floor` alone is 128 s on a runner, and it caught a fee floor
    # that was wrong by nearly 2x.
    #
    # Raised rather than trimmed, deliberately. **When this ceiling is hit the run
    # reports as "cancelled", not as a timeout**, which reads like flaky infra and
    # has twice sent somebody looking for a fault that was not there. The tell is
    # `started` and `ended` differing by exactly the limit. Sixty restores the
    # margin; if the suite ever approaches that, split the job rather than
    # deleting the tests that keep finding things.
    timeout-minutes: 60
    # The crates live in noct/, not at the repository root.
    defaults:
      run:
        working-directory: noct
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `stable`: a toolchain that moves on its own turns an
      # unrelated release into a broken build on a morning nobody changed
      # anything. Keep in step with noct/rust-toolchain.toml: release binaries
      # are reproducible, so a published hash is the toolchain's as much as the
      # source's.
      - name: Install Rust 1.85.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustc --version

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  randomx:
    name: randomx crate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: noct
    steps:
      - uses: actions/checkout@v4

      # `randomx` is deliberately excluded from the workspace: it builds the
      # RandomX C++ library and needs cmake, so `cargo test` in a plain shell
      # must not require it. Excluded also means never compiled — the same trap
      # that was called out for `swap` — and the proof-of-work lives here, so it
      # gets its own job rather than no coverage at all.
      - name: Install Rust 1.85.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Build tools
        run: |
          set -euo pipefail
          cmake --version
          c++ --version

      - name: Test the RandomX crate
        run: cargo test --manifest-path randomx/Cargo.toml --locked
