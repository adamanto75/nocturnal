<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2027"/>
      <stop offset="1" stop-color="#0a0d10"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee0a4"/>
      <stop offset="1" stop-color="#22a377"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="500" cy="524" r="286" fill="white"/>
      <circle cx="628" cy="430" r="252" fill="black"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>
  <!-- a few stars -->
  <circle cx="700" cy="300" r="10" fill="#e7edf3" opacity="0.9"/>
  <circle cx="760" cy="380" r="6" fill="#e7edf3" opacity="0.7"/>
  <circle cx="330" cy="720" r="7" fill="#e7edf3" opacity="0.6"/>
</svg>
